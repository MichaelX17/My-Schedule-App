[package]
name = "my-schedule-app"
version = "0.1.0"
description = "My Schedule App - Offline-first desktop application foundation"
authors = ["My Schedule App"]
edition = "2021"

[lib]
name = "my_schedule_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Tauri 2 build-time code generation and resource embedding
tauri-build = { version = "2", features = [] }

[dependencies]
# Core desktop framework and frontend-backend IPC bridge
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"

# Asynchronous runtime for background services and non-blocking I/O
tokio = { version = "1", features = ["full"] }

# Type-safe SQLite database access and schema migrations
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }

# Serialization and deserialization for IPC payloads and configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date, time, and timezone handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"

# Stable UUID primary keys and managed logo encoding
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

# Structured logging and environment-filtered diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Typed application errors and contextual error propagation
thiserror = "2"
anyhow = "1"

# Cryptographic verification, semver, and HTTPS client for GitHub Releases updater
ed25519-dalek = "2"
sha2 = "0.10"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
